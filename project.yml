name: MacVolumeCommunication
options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.2"

targets:
  MacVolumeCommunication:
    type: application
    platform: macOS
    sources:
      - Sources
    resources:
      - path: Resources/AppIcon.icns
    postBuildScripts:
      - name: Copy AppIcon
        script: |
          mkdir -p "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          cp "${SRCROOT}/Resources/AppIcon.icns" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/AppIcon.icns"
    settings:
      base:
        PRODUCT_NAME: MacVolumeCommunication
        PRODUCT_BUNDLE_IDENTIFIER: com.ivandrew.macvolume.communication
        MARKETING_VERSION: "3.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_ENTITLEMENTS: MacVolumeCommunication.entitlements
        SWIFT_VERSION: "5.9"
        SWIFT_STRICT_CONCURRENCY: minimal
        MACOSX_DEPLOYMENT_TARGET: "14.2"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: SoundMate
        CFBundleShortVersionString: "3.0"
        CFBundleVersion: "1"
        CFBundleIconFile: AppIcon
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: false
        NSHighResolutionCapable: true
        NSAudioCaptureUsageDescription: SoundMate needs audio access to protect other apps' volume during voice and video calls. Audio is mixed locally and is never recorded or uploaded.
        NSMicrophoneUsageDescription: SoundMate needs audio access to detect calls and control each app's volume independently. Audio is never recorded or uploaded.
