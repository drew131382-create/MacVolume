name: MacVolumeClean
options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.2"

targets:
  MacVolumeClean:
    type: application
    platform: macOS
    sources:
      - Sources
    resources:
      - path: Resources/AppIcon.icns
    postBuildScripts:
      - name: Copy AppIcon
        script: |
          mkdir -p "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          cp "${SRCROOT}/Resources/AppIcon.icns" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/AppIcon.icns"
    settings:
      base:
        PRODUCT_NAME: MacVolume
        PRODUCT_BUNDLE_IDENTIFIER: com.ivandrew.macvolume.clean
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_ENTITLEMENTS: MacVolumeClean.entitlements
        SWIFT_VERSION: "5.9"
        SWIFT_STRICT_CONCURRENCY: minimal
        MACOSX_DEPLOYMENT_TARGET: "14.2"
    info:
      path: Info.plist
